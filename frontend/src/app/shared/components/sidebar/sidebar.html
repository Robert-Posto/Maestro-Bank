<aside class="sidebar">
  <div class="sidebar__brand">
    <p class="sidebar__brand-name">MaestroBank</p>
  </div>

  <nav class="sidebar__nav">
    @for (group of navGroups; track $index) {
      <div class="sidebar__group">
        @if (group.label) {
          <p class="sidebar__group-label">{{ group.label }}</p>
        }
        @for (item of group.items; track item.route) {
          <a
            class="sidebar__link"
            [class.sidebar__link--accent]="item.accent"
            [routerLink]="item.route"
            routerLinkActive="sidebar__link--active"
          >
            <app-icon [name]="item.icon" [size]="19" />
            <span class="sidebar__link-label">{{ item.label }}</span>
            @if (item.badge) {
              <span class="sidebar__link-badge">{{ item.badge }}</span>
            }
          </a>
        }
      </div>
    }
  </nav>
</aside>
