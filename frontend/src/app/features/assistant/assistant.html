<app-page-header title="Asistent MaestroBank" subtitle="Un singur loc unde întrebi orice — te trimitem automat la răspunsul potrivit." />

<div class="assistant-hero">
  <span class="assistant-hero__icon"><app-icon name="sparkles" [size]="28" /></span>
  <h2 class="assistant-hero__title">Cu ce te pot ajuta?</h2>
  <p class="assistant-hero__subtitle">
    Scrie orice — despre bugetul tău, conturi, carduri, credite, puncte sau orice altceva. Te ducem direct la
    asistentul potrivit, cu întrebarea deja pusă.
  </p>

  <form class="assistant-form" (ngSubmit)="ask()">
    <input
      type="text"
      class="assistant-form__input"
      placeholder="Ex: Îmi permit o vacanță de 2.000 lei?"
      [ngModel]="question()"
      (ngModelChange)="question.set($event)"
      name="question"
      [disabled]="routing()"
      autofocus
    />
    <app-action-button type="submit" [loading]="routing()" [disabled]="!question().trim()">Întreabă</app-action-button>
  </form>

  <div class="assistant-examples">
    @for (example of exampleQuestions; track example) {
      <button type="button" class="assistant-example-chip" [disabled]="routing()" (click)="ask(example)">
        {{ example }}
      </button>
    }
  </div>
</div>
