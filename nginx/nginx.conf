# Nginx ca reverse proxy în fața API Gateway-ului FastAPI.
#
# Flux: Angular -> Nginx (localhost:8080) -> gateway:8000 -> microservicii -> MongoDB
#
# Nginx nu face rewrite de path și nu validează JWT — e doar un reverse
# proxy simplu. Autorizarea JWT se face în FastAPI Gateway (vezi
# backend/gateway/app/security.py), nu în Nginx.

events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        location / {
            proxy_pass http://gateway:8000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }
    }
}
