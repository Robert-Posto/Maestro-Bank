# Nginx ca reverse proxy în fața API Gateway-ului FastAPI.
#
# Flux: Angular -> Nginx (localhost:8080) -> gateway:8000 -> microservicii -> MongoDB
#
# Nginx nu face rewrite de path și nu validează JWT — e doar un reverse
# proxy simplu. Autorizarea JWT se face în FastAPI Gateway (vezi
# backend/gateway/app/security.py), nu în Nginx.

events {
    worker_connections 1024;
}

http {
    # Resolver-ul intern de Docker (DNS embedded, 127.0.0.11) + o variabilă
    # în proxy_pass forțează Nginx să RE-rezolve hostname-ul "gateway" la
    # fiecare request (cu cache de 10s), în loc să-l rezolve o singură
    # dată la pornire. Fără asta, dacă gateway e recreat (ex. rebuild,
    # `docker compose up --force-recreate gateway`) și primește altă
    # adresă IP internă, Nginx rămâne blocat pe adresa veche și returnează
    # erori până e repornit manual — capcană clasică Nginx + Docker Compose.
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;

        # Implicit Nginx acceptă doar 1MB per request — prea puțin pentru
        # upload-ul de 2 imagini la verificarea identității (buletin +
        # selfie, ~1-2MB combinat). Fără asta, cererea e respinsă cu 413
        # ÎNAINTE să ajungă la Gateway/verification-service (nu apare
        # nimic în logurile lor — se vede doar aici, în nginx).
        client_max_body_size 15m;

        # Agentul AI (Spending + Forecast) poate dura mult mai mult decât
        # un query obișnuit — implică 1+ apeluri GPT cu tool-calling (vezi
        # și timeout-ul dedicat din Gateway, backend/gateway/app/routers/proxy.py,
        # serviciul "ai"). Location mai specific -> câștigă în fața lui `/`
        # de mai jos, fără să atingă timeout-ul restului API-ului.
        location /api/ai/ {
            set $gateway_upstream http://gateway:8000;
            proxy_pass $gateway_upstream;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 110s;
            proxy_connect_timeout 5s;
        }

        location / {
            set $gateway_upstream http://gateway:8000;
            proxy_pass $gateway_upstream;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }
    }
}
