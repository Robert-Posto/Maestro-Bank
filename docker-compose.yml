services:
  # Container local, folosit ca FALLBACK când Atlas nu e accesibil (ex.
  # rețeaua companiei blochează portul 27017 spre exterior). Pornește
  # mereu alături de restul (nu costă mult, doar RAM/disc idle), dar
  # NIMENI nu-l folosește automat — fiecare decide prin propriul
  # MONGODB_URI_BASE din .env dacă vorbește cu ăsta sau cu Atlas. Vezi
  # .env.example pentru ambele variante.
  mongodb:
    image: mongo:7
    container_name: maestrobank-mongodb
    restart: unless-stopped
    ports:
      # Host port 27018 -> container port 27017, ca să nu intre în conflict
      # cu alte instanțe MongoDB care ar putea rula deja pe portul 27017 al
      # mașinii tale.
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - maestrobank-network

  # --- Microservicii FastAPI ------------------------------------------
  # Toate folosesc ACEEAȘI instanță MongoDB — Atlas (implicit, partajat
  # de toată echipa) SAU containerul local `mongodb` de mai sus, în
  # funcție de MONGODB_URI_BASE din .env — dar fiecare cu propria bază
  # de date (izolare logică, nu fizică). Niciun serviciu nu citește
  # direct din baza altui serviciu — comunicarea între ele se face doar
  # prin API, via Gateway.

  auth-service:
    build:
      context: ./backend/services/auth-service
      dockerfile: Dockerfile
    container_name: maestrobank-auth-service
    restart: unless-stopped
    ports:
      # Expus doar pentru debugging direct în development.
      - "8001:8000"
    environment:
      - MONGO_URL=${MONGODB_URI_BASE}/auth_db?appName=maestrobank
      - JWT_SECRET=${JWT_SECRET:-change-me-in-development}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_EXPIRES_MINUTES=${JWT_EXPIRES_MINUTES:-60}
      - ACCOUNTS_SERVICE_URL=http://accounts-service:8000
    volumes:
      - ./backend/services/auth-service/app:/app/app
      - ./backend/services/auth-service/tests:/app/tests
      - ./backend/services/auth-service/pytest.ini:/app/pytest.ini
      - ./scripts:/app/scripts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      accounts-service:
        condition: service_healthy
    networks:
      - maestrobank-network

  accounts-service:
    build:
      context: ./backend/services/accounts-service
      dockerfile: Dockerfile
    container_name: maestrobank-accounts-service
    restart: unless-stopped
    ports:
      - "8002:8000"
    environment:
      - MONGO_URL=${MONGODB_URI_BASE}/accounts_db?appName=maestrobank
      - JWT_SECRET=${JWT_SECRET:-change-me-in-development}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      # Folosite DOAR runtime (verificare parolă la reveal card, notificare
      # la blocare card) — fără depends_on către aceste servicii aici, ca
      # să nu creăm dependențe circulare de pornire.
      - AUTH_SERVICE_URL=http://auth-service:8000
      - SUPPORT_SERVICE_URL=http://support-service:8000
    volumes:
      - ./backend/services/accounts-service/app:/app/app
      - ./backend/services/accounts-service/tests:/app/tests
      - ./backend/services/accounts-service/pytest.ini:/app/pytest.ini
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - maestrobank-network

  transactions-service:
    build:
      context: ./backend/services/transactions-service
      dockerfile: Dockerfile
    container_name: maestrobank-transactions-service
    restart: unless-stopped
    ports:
      - "8003:8000"
    environment:
      - MONGO_URL=${MONGODB_URI_BASE}/tx_db?appName=maestrobank
      - JWT_SECRET=${JWT_SECRET:-change-me-in-development}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCOUNTS_SERVICE_URL=http://accounts-service:8000
      - BUDGETS_SERVICE_URL=http://budgets-service:8000
      - AUTH_SERVICE_URL=http://auth-service:8000
      - SUPPORT_SERVICE_URL=http://support-service:8000
    volumes:
      - ./backend/services/transactions-service/app:/app/app
      - ./backend/services/transactions-service/tests:/app/tests
      - ./backend/services/transactions-service/pytest.ini:/app/pytest.ini
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      accounts-service:
        condition: service_healthy
      budgets-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks:
      - maestrobank-network

  budgets-service:
    build:
      context: ./backend/services/budgets-service
      dockerfile: Dockerfile
    container_name: maestrobank-budgets-service
    restart: unless-stopped
    ports:
      - "8004:8000"
    environment:
      - MONGO_URL=${MONGODB_URI_BASE}/budgets_db?appName=maestrobank
      - JWT_SECRET=${JWT_SECRET:-change-me-in-development}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
    volumes:
      - ./backend/services/budgets-service/app:/app/app
      - ./backend/services/budgets-service/tests:/app/tests
      - ./backend/services/budgets-service/pytest.ini:/app/pytest.ini
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - maestrobank-network

  support-service:
    build:
      context: ./backend/services/support-service
      dockerfile: Dockerfile
    container_name: maestrobank-support-service
    restart: unless-stopped
    ports:
      - "8005:8000"
    environment:
      - MONGO_URL=${MONGODB_URI_BASE}/support_db?appName=maestrobank
      - JWT_SECRET=${JWT_SECRET:-change-me-in-development}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
    volumes:
      - ./backend/services/support-service/app:/app/app
      - ./backend/services/support-service/tests:/app/tests
      - ./backend/services/support-service/pytest.ini:/app/pytest.ini
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - maestrobank-network

  exchange-service:
    build:
      context: ./backend/services/exchange-service
      dockerfile: Dockerfile
    container_name: maestrobank-exchange-service
    restart: unless-stopped
    ports:
      - "8006:8000"
    environment:
      - MONGO_URL=${MONGODB_URI_BASE}/exchange_db?appName=maestrobank
      - JWT_SECRET=${JWT_SECRET:-change-me-in-development}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      # Curs valutar real (BNR) — vezi app/bnr_rates.py. Reîmprospătat la
      # fiecare N secunde (implicit 6h); BNR publică o dată/zi lucrătoare.
      - RATES_REFRESH_INTERVAL_SECONDS=${RATES_REFRESH_INTERVAL_SECONDS:-21600}
    volumes:
      - ./backend/services/exchange-service/app:/app/app
      - ./backend/services/exchange-service/tests:/app/tests
      - ./backend/services/exchange-service/pytest.ini:/app/pytest.ini
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - maestrobank-network

  # --- API Gateway ------------------------------------------------------
  # Singurul serviciu backend pe care Angular (prin Nginx) îl apelează
  # direct. Rutează /api/{service}/* către microserviciul corespunzător.

  gateway:
    build:
      context: ./backend/gateway
      dockerfile: Dockerfile
    container_name: maestrobank-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGO_URL=${MONGODB_URI_BASE}/?appName=maestrobank
      - JWT_SECRET=${JWT_SECRET:-change-me-in-development}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - AUTH_SERVICE_URL=http://auth-service:8000
      - ACCOUNTS_SERVICE_URL=http://accounts-service:8000
      - TRANSACTIONS_SERVICE_URL=http://transactions-service:8000
      - BUDGETS_SERVICE_URL=http://budgets-service:8000
      - SUPPORT_SERVICE_URL=http://support-service:8000
      - EXCHANGE_SERVICE_URL=http://exchange-service:8000
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:8080}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-300}
      - RATE_LIMIT_WINDOW_SECONDS=${RATE_LIMIT_WINDOW_SECONDS:-60}
    volumes:
      - ./backend/gateway/app:/app/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      auth-service:
        condition: service_healthy
      accounts-service:
        condition: service_healthy
      transactions-service:
        condition: service_healthy
      budgets-service:
        condition: service_healthy
      support-service:
        condition: service_healthy
      exchange-service:
        condition: service_healthy
    networks:
      - maestrobank-network

  # --- Nginx (reverse proxy) --------------------------------------------
  # Angular vorbește cu backendul prin Nginx, nu direct cu Gateway-ul.

  nginx:
    image: nginx:1.27-alpine
    container_name: maestrobank-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      # Verifică și că Nginx e sus, ȘI că poate ajunge la Gateway prin proxy
      # (exact traseul care s-a stricat la un rebuild anterior al gateway-ului).
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - maestrobank-network

  # --- Frontend -----------------------------------------------------------

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: maestrobank-frontend
    restart: unless-stopped
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - maestrobank-network

networks:
  maestrobank-network:
    driver: bridge

volumes:
  mongodb_data:
