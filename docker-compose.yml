services:
  # Container local, folosit ca FALLBACK când Atlas nu e accesibil (ex.
  # rețeaua companiei blochează portul 27017 spre exterior). Pornește
  # mereu alături de restul (nu costă mult, doar RAM/disc idle), dar
  # NIMENI nu-l folosește automat — fiecare decide prin propriul
  # MONGODB_URI_BASE din .env dacă vorbește cu ăsta sau cu Atlas. Vezi
  # .env.example pentru ambele variante.
  mongodb:
    image: mongo:7
    container_name: maestrobank-mongodb
    restart: unless-stopped
    ports:
      # Host port 27018 -> container port 27017, ca să nu intre în conflict
      # cu alte instanțe MongoDB care ar putea rula deja pe portul 27017 al
      # mașinii tale.
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - maestrobank-network

  # --- Microservicii FastAPI ------------------------------------------
  # Toate folosesc ACEEAȘI instanță MongoDB — Atlas (implicit, partajat
  # de toată echipa) SAU containerul local `mongodb` de mai sus, în
  # funcție de MONGODB_URI_BASE din .env — dar fiecare cu propria bază
  # de date (izolare logică, nu fizică). Niciun serviciu nu citește
  # direct din baza altui serviciu — comunicarea între ele se face doar
  # prin API, via Gateway.

  auth-service:
    build:
      context: ./backend/services/auth-service
      dockerfile: Dockerfile
    container_name: maestrobank-auth-service
    restart: unless-stopped
    ports:
      # Expus doar pentru debugging direct în development.
      - "8001:8000"
    environment:
      - MONGO_URL=${MONGODB_URI_BASE}/auth_db?appName=maestrobank
      - JWT_SECRET=${JWT_SECRET:-change-me-in-development}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_EXPIRES_MINUTES=${JWT_EXPIRES_MINUTES:-60}
      - ACCOUNTS_SERVICE_URL=http://accounts-service:8000
      # WebAuthn/passkeys — rp_id/origin trebuie să reflecte unde navighează
      # EFECTIV browserul (Angular pe :4200), nu Nginx (:8080, doar API).
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-localhost}
      - WEBAUTHN_RP_NAME=${WEBAUTHN_RP_NAME:-MaestroBank}
      - WEBAUTHN_ORIGINS=${WEBAUTHN_ORIGINS:-http://localhost:4200}
      - WEBAUTHN_CHALLENGE_TTL_SECONDS=${WEBAUTHN_CHALLENGE_TTL_SECONDS:-120}
      # Verificare email la onboarding — dacă SMTP_HOST lipsește, codul e
      # doar logat (docker logs auth-service), nu trimis efectiv. Vezi
      # .env.example pentru cum pui un cont SMTP real.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-no-reply@maestrobank.local}
      - EMAIL_VERIFICATION_CODE_TTL_MINUTES=${EMAIL_VERIFICATION_CODE_TTL_MINUTES:-15}
    volumes:
      - ./backend/services/auth-service/app:/app/app
      - ./backend/services/auth-service/tests:/app/tests
      - ./backend/services/auth-service/pytest.ini:/app/pytest.ini
      - ./scripts:/app/scripts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      accounts-service:
        condition: service_healthy
    networks:
      - maestrobank-network

  accounts-service:
    build:
      context: ./backend/services/accounts-service
      dockerfile: Dockerfile
    container_name: maestrobank-accounts-service
    restart: unless-stopped
    ports:
      - "8002:8000"
    environment:
      - MONGO_URL=${MONGODB_URI_BASE}/accounts_db?appName=maestrobank
      - JWT_SECRET=${JWT_SECRET:-change-me-in-development}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      # Folosite DOAR runtime (verificare parolă la reveal card, notificare
      # la blocare card) — fără depends_on către aceste servicii aici, ca
      # să nu creăm dependențe circulare de pornire.
      - AUTH_SERVICE_URL=http://auth-service:8000
      - SUPPORT_SERVICE_URL=http://support-service:8000
    volumes:
      - ./backend/services/accounts-service/app:/app/app
      - ./backend/services/accounts-service/tests:/app/tests
      - ./backend/services/accounts-service/pytest.ini:/app/pytest.ini
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - maestrobank-network

  transactions-service:
    build:
      context: ./backend/services/transactions-service
      dockerfile: Dockerfile
    container_name: maestrobank-transactions-service
    restart: unless-stopped
    ports:
      - "8003:8000"
    environment:
      - MONGO_URL=${MONGODB_URI_BASE}/tx_db?appName=maestrobank
      - JWT_SECRET=${JWT_SECRET:-change-me-in-development}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCOUNTS_SERVICE_URL=http://accounts-service:8000
      - BUDGETS_SERVICE_URL=http://budgets-service:8000
      - AUTH_SERVICE_URL=http://auth-service:8000
      - SUPPORT_SERVICE_URL=http://support-service:8000
      - EXCHANGE_SERVICE_URL=http://exchange-service:8000
      - POINTS_SERVICE_URL=http://points-service:8000
      # Guardian (app/guardian/) — explicații LLM ale deciziilor motorului
      # de fraudă. Aceleași variabile Azure OpenAI ca ai-orchestrator-service
      # (vezi .env), dar client propriu, izolat — vezi app/guardian/llm_client.py.
      - GUARDIAN_ENABLED=${GUARDIAN_ENABLED:-true}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT:-gpt-5-mini}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-2024-10-21}
      - GUARDIAN_LLM_TIMEOUT_SECONDS=${GUARDIAN_LLM_TIMEOUT_SECONDS:-8.0}
      - GUARDIAN_STAFF_REPORT_BANDS=${GUARDIAN_STAFF_REPORT_BANDS:-hold}
    volumes:
      - ./backend/services/transactions-service/app:/app/app
      - ./backend/services/transactions-service/tests:/app/tests
      - ./backend/services/transactions-service/pytest.ini:/app/pytest.ini
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      accounts-service:
        condition: service_healthy
      budgets-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks:
      - maestrobank-network

  budgets-service:
    build:
      context: ./backend/services/budgets-service
      dockerfile: Dockerfile
    container_name: maestrobank-budgets-service
    restart: unless-stopped
    ports:
      - "8004:8000"
    environment:
      - MONGO_URL=${MONGODB_URI_BASE}/budgets_db?appName=maestrobank
      - JWT_SECRET=${JWT_SECRET:-change-me-in-development}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      # Detecție pasivă de abonamente — citește istoricul de tranzacții.
      - TRANSACTIONS_SERVICE_URL=http://transactions-service:8000
    volumes:
      - ./backend/services/budgets-service/app:/app/app
      - ./backend/services/budgets-service/tests:/app/tests
      - ./backend/services/budgets-service/pytest.ini:/app/pytest.ini
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - maestrobank-network

  support-service:
    build:
      context: ./backend/services/support-service
      dockerfile: Dockerfile
    container_name: maestrobank-support-service
    restart: unless-stopped
    ports:
      - "8005:8000"
    environment:
      - MONGO_URL=${MONGODB_URI_BASE}/support_db?appName=maestrobank
      - JWT_SECRET=${JWT_SECRET:-change-me-in-development}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      # Documente de semnat (eSign) — căutare de clienți + verificare
      # step-up la semnare, ambele găzduite de auth-service.
      - AUTH_SERVICE_URL=http://auth-service:8000
    volumes:
      - ./backend/services/support-service/app:/app/app
      - ./backend/services/support-service/tests:/app/tests
      - ./backend/services/support-service/pytest.ini:/app/pytest.ini
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - maestrobank-network

  exchange-service:
    build:
      context: ./backend/services/exchange-service
      dockerfile: Dockerfile
    container_name: maestrobank-exchange-service
    restart: unless-stopped
    ports:
      - "8006:8000"
    environment:
      - MONGO_URL=${MONGODB_URI_BASE}/exchange_db?appName=maestrobank
      - JWT_SECRET=${JWT_SECRET:-change-me-in-development}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      # Curs valutar real (BNR) — vezi app/bnr_rates.py. Reîmprospătat la
      # fiecare N secunde (implicit 6h); BNR publică o dată/zi lucrătoare.
      - RATES_REFRESH_INTERVAL_SECONDS=${RATES_REFRESH_INTERVAL_SECONDS:-21600}
      # Adresă INTERNĂ Docker — schimbul valutar chiar mută solduri acum
      # (POST /exchange/execute), prin accounts-service/internal/accounts/exchange.
      - ACCOUNTS_SERVICE_URL=http://accounts-service:8000
    volumes:
      - ./backend/services/exchange-service/app:/app/app
      - ./backend/services/exchange-service/tests:/app/tests
      - ./backend/services/exchange-service/pytest.ini:/app/pytest.ini
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - maestrobank-network

  deposits-service:
    build:
      context: ./backend/services/deposits-service
      dockerfile: Dockerfile
    container_name: maestrobank-deposits-service
    restart: unless-stopped
    ports:
      - "8009:8000"
    environment:
      - MONGO_URL=${MONGODB_URI_BASE}/deposits_db?appName=maestrobank
      - JWT_SECRET=${JWT_SECRET:-change-me-in-development}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCOUNTS_SERVICE_URL=http://accounts-service:8000
    volumes:
      - ./backend/services/deposits-service/app:/app/app
      - ./backend/services/deposits-service/tests:/app/tests
      - ./backend/services/deposits-service/pytest.ini:/app/pytest.ini
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      accounts-service:
        condition: service_healthy
    networks:
      - maestrobank-network

  investments-service:
    build:
      context: ./backend/services/investments-service
      dockerfile: Dockerfile
    container_name: maestrobank-investments-service
    restart: unless-stopped
    ports:
      - "8010:8000"
    environment:
      - MONGO_URL=${MONGODB_URI_BASE}/investments_db?appName=maestrobank
      - JWT_SECRET=${JWT_SECRET:-change-me-in-development}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCOUNTS_SERVICE_URL=http://accounts-service:8000
    volumes:
      - ./backend/services/investments-service/app:/app/app
      - ./backend/services/investments-service/tests:/app/tests
      - ./backend/services/investments-service/pytest.ini:/app/pytest.ini
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      accounts-service:
        condition: service_healthy
    networks:
      - maestrobank-network

  points-service:
    build:
      context: ./backend/services/points-service
      dockerfile: Dockerfile
    container_name: maestrobank-points-service
    restart: unless-stopped
    ports:
      - "8011:8000"
    environment:
      - MONGO_URL=${MONGODB_URI_BASE}/points_db?appName=maestrobank
      - JWT_SECRET=${JWT_SECRET:-change-me-in-development}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCOUNTS_SERVICE_URL=http://accounts-service:8000
    volumes:
      - ./backend/services/points-service/app:/app/app
      - ./backend/services/points-service/tests:/app/tests
      - ./backend/services/points-service/pytest.ini:/app/pytest.ini
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      accounts-service:
        condition: service_healthy
    networks:
      - maestrobank-network

  # --- Verificare identitate (KYC demo) -----------------------------------
  # STATELESS — fără MONGO_URL, nu are bază proprie (vezi app/main.py).
  # Compară buletin vs. selfie cu DeepFace, apoi marchează userul verificat
  # printr-un apel intern către auth-service. Build MULT mai lent decât la
  # celelalte servicii (DeepFace -> TensorFlow) — normal, o singură dată.

  verification-service:
    build:
      context: ./backend/services/verification-service
      dockerfile: Dockerfile
    container_name: maestrobank-verification-service
    restart: unless-stopped
    ports:
      - "8007:8000"
    environment:
      - JWT_SECRET=${JWT_SECRET:-change-me-in-development}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - AUTH_SERVICE_URL=http://auth-service:8000
    volumes:
      - ./backend/services/verification-service/app:/app/app
      - ./backend/services/verification-service/tests:/app/tests
      - ./backend/services/verification-service/pytest.ini:/app/pytest.ini
      # Modelul DeepFace (~580MB) se descarcă o singură dată, la boot —
      # volum dedicat ca să NU se piardă (și redescarce) la fiecare
      # recreare a containerului (ex. după un rebuild de imagine).
      - verification_models:/root/.deepface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 5
      # Modelul se încarcă în memorie la boot (lifespan, main.py) — /health
      # nu răspunde până nu termină, exact ca să Gateway-ul (depends_on mai
      # jos) nu înceapă să rutească cereri către un serviciu nepregătit.
      # 90s acoperă și cazul cel mai lent (descărcare model dacă volumul
      # e gol + încărcare în memorie).
      start_period: 90s
    depends_on:
      auth-service:
        condition: service_healthy
    networks:
      - maestrobank-network

  ai-orchestrator-service:
    build:
      context: ./backend/services/ai-orchestrator-service
      dockerfile: Dockerfile
    container_name: maestrobank-ai-orchestrator-service
    restart: unless-stopped
    ports:
      # Expus doar pentru debugging direct în development. Port diferit de
      # verification-service (8007) — nu pot împărți același port de host.
      - "8008:8000"
    environment:
      - JWT_SECRET=${JWT_SECRET:-change-me-in-development}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      # Datele de cont/tranzacții tot vin STRICT prin Gateway (vezi
      # app/tools/*) — MONGO_URL de mai jos ține DOAR istoricul
      # conversațiilor (vezi app/database.py), nu date financiare.
      - GATEWAY_URL=http://gateway:8000
      - MONGO_URL=${MONGODB_URI_BASE}/ai_orchestrator_db?appName=maestrobank
      # Azure OpenAI (GPT-5-mini) — vezi .env.example. Fără credențiale
      # setate, serviciul tot pornește (health check trece), dar orice
      # cerere de chat întoarce 503 până sunt configurate.
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT:-gpt-5-mini}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-2024-10-21}
      # Embeddings pentru RAG (vezi app/rag/retriever.py) — OPȚIONALE: dacă
      # lipsesc, cad automat pe AZURE_OPENAI_ENDPOINT/API_KEY de mai sus
      # (de obicei aceeași resursă Azure); dacă TOT lipsesc, RAG-ul
      # funcționează pe fallback local TF-IDF, fără nicio eroare.
      - AZURE_OPENAI_EMBEDDING_ENDPOINT=${AZURE_OPENAI_EMBEDDING_ENDPOINT:-}
      - AZURE_OPENAI_EMBEDDING_API_KEY=${AZURE_OPENAI_EMBEDDING_API_KEY:-}
      - AZURE_OPENAI_EMBEDDING_DEPLOYMENT=${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:-text-embedding-3-small}
      - AZURE_OPENAI_REQUEST_TIMEOUT_SECONDS=${AZURE_OPENAI_REQUEST_TIMEOUT_SECONDS:-45.0}
    volumes:
      - ./backend/services/ai-orchestrator-service/app:/app/app
      - ./backend/services/ai-orchestrator-service/tests:/app/tests
      - ./backend/services/ai-orchestrator-service/pytest.ini:/app/pytest.ini
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    # Tool-urile lui apelează accounts/transactions/budgets prin Gateway,
    # dar Gateway-ul însuși e cel care depinde de acest serviciu (mai jos),
    # nu invers — fără depends_on aici, ca să nu creăm un ciclu.
    networks:
      - maestrobank-network

  # --- API Gateway ------------------------------------------------------
  # Singurul serviciu backend pe care Angular (prin Nginx) îl apelează
  # direct. Rutează /api/{service}/* către microserviciul corespunzător.

  gateway:
    build:
      context: ./backend/gateway
      dockerfile: Dockerfile
    container_name: maestrobank-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGO_URL=${MONGODB_URI_BASE}/?appName=maestrobank
      - JWT_SECRET=${JWT_SECRET:-change-me-in-development}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - AUTH_SERVICE_URL=http://auth-service:8000
      - ACCOUNTS_SERVICE_URL=http://accounts-service:8000
      - TRANSACTIONS_SERVICE_URL=http://transactions-service:8000
      - BUDGETS_SERVICE_URL=http://budgets-service:8000
      - SUPPORT_SERVICE_URL=http://support-service:8000
      - EXCHANGE_SERVICE_URL=http://exchange-service:8000
      - DEPOSITS_SERVICE_URL=http://deposits-service:8000
      - INVESTMENTS_SERVICE_URL=http://investments-service:8000
      - POINTS_SERVICE_URL=http://points-service:8000
      - VERIFICATION_SERVICE_URL=http://verification-service:8000
      - AI_SERVICE_URL=http://ai-orchestrator-service:8000
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:8080}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-300}
      - RATE_LIMIT_WINDOW_SECONDS=${RATE_LIMIT_WINDOW_SECONDS:-60}
    volumes:
      - ./backend/gateway/app:/app/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      auth-service:
        condition: service_healthy
      accounts-service:
        condition: service_healthy
      transactions-service:
        condition: service_healthy
      budgets-service:
        condition: service_healthy
      support-service:
        condition: service_healthy
      exchange-service:
        condition: service_healthy
      verification-service:
        condition: service_healthy
      ai-orchestrator-service:
        condition: service_healthy
    networks:
      - maestrobank-network

  # --- Nginx (reverse proxy) --------------------------------------------
  # Angular vorbește cu backendul prin Nginx, nu direct cu Gateway-ul.

  nginx:
    image: nginx:1.27-alpine
    container_name: maestrobank-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      # Verifică și că Nginx e sus, ȘI că poate ajunge la Gateway prin proxy
      # (exact traseul care s-a stricat la un rebuild anterior al gateway-ului).
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - maestrobank-network

  # --- Frontend -----------------------------------------------------------

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: maestrobank-frontend
    restart: unless-stopped
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - maestrobank-network

networks:
  maestrobank-network:
    driver: bridge

volumes:
  mongodb_data:
  verification_models:
